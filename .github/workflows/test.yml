name: Проверка production-сборки

on:
  pull_request:
  workflow_call:
    secrets:
      CI_BACKEND_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: Europe/Moscow
  VITE_SERVER_LINK: ""
  VITE_MEET_SERVER_LINK: ""

jobs:
  verify:
    name: Типы, стиль и production-сборка
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Проверить типы
        run: npm run typecheck
      - name: Проверить ESLint
        run: npm run lint
      - name: Проверить логику приложения
        run: npm test
      - name: Проверить регистрацию Playwright-тестов
        run: npx playwright test --list
      - name: Собрать production
        run: npm run build
      - name: Проверить лимит 200 КБ и ES2015
        run: npm run check:build
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist
          include-hidden-files: true
          retention-days: 7

  e2e-public:
    name: Playwright — публичные страницы
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist
      - name: Установить Chromium
        run: npx playwright install --with-deps chromium
      - name: Проверить публичные флоу
        run: npm run test:e2e -- --grep @public --output=test-results/public
      - name: Сохранить публичный браузерный отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-smoke
          path: |
            playwright-report
            test-results
          retention-days: 7

  e2e-backend:
    name: Playwright — настоящий backend и состояния ошибок
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_BACKEND_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist
      - name: Проверить секрет доступа к backend
        env:
          CI_BACKEND_TOKEN: ${{ secrets.CI_BACKEND_TOKEN }}
        run: |
          if [ -z "$CI_BACKEND_TOKEN" ]; then
            echo "::error::В Repository secrets Frontend отсутствует CI_BACKEND_TOKEN"
            exit 1
          fi
      - name: Получить backend
        uses: actions/checkout@v4
        with:
          repository: LearnForgeDev/Backend-General
          ref: 6484e3c65220910cc834148fae1544ebc9e49971
          path: .ci/backend
          token: ${{ secrets.CI_BACKEND_TOKEN }}
          persist-credentials: false
      - name: Создать временный TOTP для тестового окружения
        id: totp
        run: |
          ci_totp_secret=$(python3 -c 'import base64, os; print(base64.b32encode(os.urandom(20)).decode())')
          echo "::add-mask::$ci_totp_secret"
          echo "CI_ADMIN_TOTP_SECRET=$ci_totp_secret" >> "$GITHUB_ENV"
      - name: Установить Chromium
        run: npx playwright install --with-deps chromium
      - name: Поднять тестовый backend
        run: docker compose -f tests/backend/compose.yml up -d api
      - name: Дождаться готовности API и хранилища
        id: ready
        run: |
          curl --fail --retry 90 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:8080/health
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:9000/minio/health/ready
      - name: Проверить флоу с настоящим backend
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/backend
        run: npm run test:e2e -- --grep-invert '@public|@ui-errors' --output=test-results/backend
      - name: Проверить интерфейс при отказах запросов
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/errors
        run: npm run test:e2e -- --grep @ui-errors --output=test-results/errors
      - name: Сохранить браузерные отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-checks
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Сохранить логи backend
        if: ${{ failure() && steps.totp.outcome == 'success' }}
        run: docker compose -f tests/backend/compose.yml logs --no-color
      - name: Удалить тестовое окружение
        if: ${{ always() && steps.totp.outcome == 'success' }}
        run: docker compose -f tests/backend/compose.yml down --volumes --remove-orphans
