name: CI

on:
  pull_request:
  workflow_call:
    secrets:
      CI_BACKEND_TOKEN:
        required: false
      CI_ADMIN_TOTP_SECRET:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: Europe/Moscow
  VITE_SERVER_LINK: ""
  VITE_MEET_SERVER_LINK: ""
  CI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}

jobs:
  backend-target:
    name: backend-target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.backend.outputs.mode }}
      url: ${{ steps.backend.outputs.url }}
    steps:
      - name: backend-selection
        id: backend
        env:
          EXISTING_BACKEND_URL: ${{ vars.CI_BACKEND_URL }}
          EXISTING_ADMIN_SECRET: ${{ secrets.CI_ADMIN_TOTP_SECRET }}
        run: |
          if [ -n "$EXISTING_BACKEND_URL" ]; then
            case "$EXISTING_BACKEND_URL" in
              http://*|https://*) ;;
              *) echo "::error::CI_BACKEND_URL must be an HTTP(S) test backend URL"; exit 1 ;;
            esac
            if [ "$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "${EXISTING_BACKEND_URL%/}/health")" = 200 ]; then
              test -n "$EXISTING_ADMIN_SECRET" || { echo "::error::CI_ADMIN_TOTP_SECRET is required for the shared test backend"; exit 1; }
              printf 'mode=existing\nurl=%s\n' "${EXISTING_BACKEND_URL%/}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::Shared test backend unavailable; using the temporary fallback"
          fi
          printf 'mode=temporary\nurl=http://127.0.0.1:8080\n' >> "$GITHUB_OUTPUT"

  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: typechecking
            command: npm run typecheck
          - name: eslint
            command: npm run lint
          - name: naming
            command: npm run validate:naming -- --base "$CI_BASE_REF"
          - name: documentation
            command: npm run validate:docs -- --base "$CI_BASE_REF" --check content
          - name: documentation-coverage
            command: npm run validate:docs -- --base "$CI_BASE_REF" --check coverage
          - name: validator-regressions
            command: node --test scripts/*.test.mjs
          - name: playwright-registration
            command: npx playwright test --list
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: dependencies
        run: npm ci
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: dependencies
        run: npm ci
      - name: unit-tests
        run: npm test -- --coverage
      - name: coverage-report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-coverage
          path: coverage
          if-no-files-found: error
          retention-days: 7

  test-coverage:
    name: test-coverage
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: coverage-report
        uses: actions/download-artifact@v7
        with:
          name: test-coverage
          path: coverage
      - name: test-coverage
        run: npm run validate:coverage -- --base "$CI_BASE_REF"

  build:
    name: build
    needs: backend-target
    env:
      CI_BACKEND_URL: ${{ needs.backend-target.outputs.url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: dependencies
        run: npm ci
      - name: build
        run: npm run build
      - name: build-artifact
        uses: actions/upload-artifact@v6
        with:
          name: production-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 7

  build-policy:
    name: build-policy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: dependencies
        run: npm ci
      - name: build-artifact
        uses: actions/download-artifact@v7
        with:
          name: production-build
          path: .next
      - name: build-policy
        run: npm run check:build

  e2e-public:
    name: e2e/public
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: dependencies
        run: npm ci
      - name: build-artifact
        uses: actions/download-artifact@v7
        with:
          name: production-build
          path: .next
      - name: chromium
        run: npx playwright install --with-deps chromium
      - name: e2e/public
        run: npm run test:e2e -- --grep @public --output=test-results/public
      - name: browser-report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: public-smoke
          path: |
            playwright-report
            test-results
          retention-days: 7

  e2e-backend:
    name: e2e/backend
    needs: [build, backend-target]
    env:
      CI_BACKEND_URL: ${{ needs.backend-target.outputs.url }}
      CI_ADMIN_TOTP_SECRET: ${{ secrets.CI_ADMIN_TOTP_SECRET }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: backend-e2e-${{ vars.CI_BACKEND_URL && 'shared' || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: dependencies
        run: npm ci
      - name: build-artifact
        uses: actions/download-artifact@v7
        with:
          name: production-build
          path: .next
      - name: backend-selection
        id: backend
        env:
          BACKEND_MODE: ${{ needs.backend-target.outputs.mode }}
        run: echo "mode=$BACKEND_MODE" >> "$GITHUB_OUTPUT"
      - name: backend-access
        if: steps.backend.outputs.mode == 'temporary'
        env:
          CI_BACKEND_TOKEN: ${{ secrets.CI_BACKEND_TOKEN }}
        run: test -n "$CI_BACKEND_TOKEN" || { echo "::error::CI_BACKEND_TOKEN is required for the temporary backend"; exit 1; }
      - name: backend-checkout
        if: steps.backend.outputs.mode == 'temporary'
        uses: actions/checkout@v5
        with:
          repository: LearnForgeDev/Backend-General
          ref: 6484e3c65220910cc834148fae1544ebc9e49971
          path: .ci/backend
          token: ${{ secrets.CI_BACKEND_TOKEN }}
          persist-credentials: false
      - name: backend-key
        if: steps.backend.outputs.mode == 'temporary'
        run: |
          ci_totp_secret=$(python3 -c 'import base64, os; print(base64.b32encode(os.urandom(20)).decode())')
          echo "::add-mask::$ci_totp_secret"
          echo "CI_ADMIN_TOTP_SECRET=$ci_totp_secret" >> "$GITHUB_ENV"
      - name: chromium
        run: npx playwright install --with-deps chromium
      - name: backend-start
        id: start
        if: steps.backend.outputs.mode == 'temporary'
        run: docker compose -f tests/backend/compose.yml up -d api
      - name: backend-readiness
        run: curl --fail --retry 90 --retry-delay 2 --retry-connrefused --retry-all-errors "$CI_BACKEND_URL/health"
      - name: storage-readiness
        if: steps.backend.outputs.mode == 'temporary'
        run: curl --fail --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:9000/minio/health/ready
      - name: e2e/backend
        run: npm run test:e2e -- --grep-invert @public --output=test-results/backend
      - name: browser-report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-checks
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: backend-logs
        if: ${{ failure() && steps.start.outcome != 'skipped' && steps.backend.outputs.mode == 'temporary' }}
        run: docker compose -f tests/backend/compose.yml logs --no-color
      - name: backend-cleanup
        if: ${{ always() && steps.start.outcome != 'skipped' && steps.backend.outputs.mode == 'temporary' }}
        run: docker compose -f tests/backend/compose.yml down --volumes --remove-orphans

  verify:
    name: ci
    if: always()
    needs: [backend-target, checks, unit-tests, test-coverage, build, build-policy, e2e-public, e2e-backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
