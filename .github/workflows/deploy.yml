name: Deploy Project

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build project
        env:
          VITE_PRODUCTION_SERVER_LINK: ${{ secrets.VITE_PRODUCTION_SERVER_LINK || vars.VITE_PRODUCTION_SERVER_LINK }}
          VITE_DEV_SERVER_LINK: ${{ secrets.VITE_DEV_SERVER_LINK || vars.VITE_DEV_SERVER_LINK }}
        run: npm run build
      - name: Get SSH keys and set permission
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy using rsync
        run: scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -r ./dist/* ${{secrets.SSH_USER}}@${{ secrets.SSH_HOST }}:~/Frontend
      - name: Restart server
        run: ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{secrets.SSH_USER}}@${{ secrets.SSH_HOST }} "pm2 reload 0"